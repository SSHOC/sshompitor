name: Weekly Full API Dump

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  weekly_dump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # editable install of the repo (comment out if using PYTHONPATH hack)
      - name: Install local package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install runtime deps
        run: |
          pip install -r requirements.txt

      # Run the data pull
      - name: Run full data fetch
        run: |
          mkdir -p data
          python scripts/fetch_full_items.py

      # Commit whatever JSON/Parquet files were just written
      - name: Commit snapshots
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --no-rebase https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/mkrzmr/sshompitor.git main
          git add data/full_items_*.json data/full_items_*.parquet
          git commit -m "Weekly full API snapshot $(date -u)" || echo "No changes"
          git push https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/mkrzmr/sshompitor.git main
