name: Weekly Full API Dump

on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Collect full paginated data
        env:
          OUTDIR: ${{ github.workspace }}/data
        run: |
          set -euo pipefail
          TS=$(date +%s)
          mkdir -p "$OUTDIR"

          declare -A ENDPOINTS=(
            ["tools-services"]="https://marketplace-api.sshopencloud.eu/api/tools-services"
            ["training-materials"]="https://marketplace-api.sshopencloud.eu/api/training-materials"
            ["publications"]="https://marketplace-api.sshopencloud.eu/api/publications"
            ["datasets"]="https://marketplace-api.sshopencloud.eu/api/datasets"
            ["workflows"]="https://marketplace-api.sshopencloud.eu/api/workflows"
          )
          declare -A KEYS=(
            ["tools-services"]="toolsServices"
            ["training-materials"]="trainingMaterials"
            ["publications"]="publications"
            ["datasets"]="datasets"
            ["workflows"]="workflows"
          )

          FILES=()

          for CAT in "${!ENDPOINTS[@]}"; do
            BASE=${ENDPOINTS[$CAT]}
            KEY=${KEYS[$CAT]}

            FIRST=$(curl -s "${BASE}?page=1")
            PAGES=$(echo "$FIRST" | jq -r '.pages // 1')

            TMPDIR=$(mktemp -d)
            META="$TMPDIR/meta.json"
            ITEMS="$TMPDIR/items.json"

            echo "$FIRST" | jq "del(.\${KEY})" > "$META"
            echo "[" > "$ITEMS"
            FIRST_FLAG=true
            echo "$FIRST" | jq -c ".\${KEY} // [] | .[]" | while read -r itm; do
              if \$FIRST_FLAG; then
                echo "$itm" >> "$ITEMS"; FIRST_FLAG=false;
              else
                echo "," >> "$ITEMS" && echo "$itm" >> "$ITEMS";
              fi
            done

            for ((p=2;p<=PAGES;p++)); do
              curl -s "${BASE}?page=$p" | jq -c ".\${KEY} // [] | .[]" | while read -r itm; do
                echo "," >> "$ITEMS" && echo "$itm" >> "$ITEMS";
              done
            done
            echo "]" >> "$ITEMS"

            FULL="$TMPDIR/full.json"
            jq -s '.[0] + {items: .[1]}' "$META" "$ITEMS" > "$FULL"

            CATFILE="$TMPDIR/cat.json"
            jq -n --arg key "$CAT" --argfile data "$FULL" '{($key): $data}' > "$CATFILE"
            FILES+=("$CATFILE")
          done

          echo "Merging category files: ${FILES[*]}"
          jq -s 'reduce .[] as $o ({}; . * $o)' "${FILES[@]}" > "$OUTDIR/combined.json"

          # validate combined.json
          if ! jq empty "$OUTDIR/combined.json"; then
            echo "combined.json is invalid:"
            cat "$OUTDIR/combined.json"
            exit 1
          fi

          jq -n --arg ts "$TS" --slurpfile d "$OUTDIR/combined.json" '{($ts): $d[0]}' > "$OUTDIR/full_items.json"

      - name: Commit snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TS=$(jq -r 'keys[0]' data/full_items.json)
          SNAP="data/full_items_${TS}.json"
          cp data/full_items.json "$SNAP"
          git add "$SNAP"
          git commit -m "Weekly dump $TS" || echo "No changes"
          git push
